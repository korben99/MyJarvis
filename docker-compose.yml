services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: jarvis-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE_URL=https://api.openai.com/v1
      - WEBUI_SECRET_KEY=jarvisopenwebui
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - RAG_EMBEDDING_ENGINE=
      - RAG_EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - DEFAULT_MODELS=gpt-4o-mini
    depends_on:
      - qdrant
      - redis

  jarvis-api:
    build:
      context: ./jarvis-core
      dockerfile: Dockerfile
    container_name: jarvis-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./jarvis-core/main.py:/app/main.py
      - ./jarvis-core/memory.py:/app/memory.py
      - ./jarvis-core/analyzer.py:/app/analyzer.py
      - ./jarvis-core/config.py:/app/config.py
      - ./jarvis-core/google_services.py:/app/google_services.py
      - ./jarvis-core/llm_router.py:/app/llm_router.py
      - ./jarvis-core/briefing.py:/app/briefing.py
      - ./jarvis-core/self.py:/app/self.py
      - ./jarvis-core/trading.py:/app/trading.py
      - ./jarvis-core/JarvisData:/app/data
      - ./TradeData:/app/trade_data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_URL=https://api.openai.com/v1
      - PRIMARY_MODEL=gpt-4o-mini
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACEHUB_API_TOKEN=${HF_TOKEN}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=open-webui_knowledge
      - REDIS_URL=redis://redis:6379
      - RAG_TOP_K=5
      - RAG_SCORE_THRESHOLD=0.4
      - ENABLE_ANALYSIS=true
      - SELF_MEMORY_PATH=/app/data/jarvis-self.json
      - MODEL_CACHE_DIR=/app/data/model_cache
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      # ── Tier 1: Router model (GPT-4.1-nano now → Qwen2.5-7B via mlx-lm later) ──
      # Disable LLM router entirely: ROUTER_MODEL=  (falls back to embedding router)
      - ROUTER_API_URL=${ROUTER_API_URL:-https://api.openai.com/v1}
      - ROUTER_API_KEY=${ROUTER_API_KEY:-}
      - ROUTER_MODEL=${ROUTER_MODEL:-gpt-4.1-nano}
      - ROUTER_TIMEOUT=${ROUTER_TIMEOUT:-6}
      # ── Tier 2: Reasoning model (GPT-5.1 now → Qwen2.5-32B via mlx-lm later) ──
      # Disable: leave REASONING_MODEL empty
      - REASONING_API_URL=${REASONING_API_URL:-https://api.openai.com/v1}
      - REASONING_API_KEY=${REASONING_API_KEY:-}
      - REASONING_MODEL=${REASONING_MODEL:-}
      - REASONING_TIMEOUT=${REASONING_TIMEOUT:-90}
      # ── Option : Vision model (GPT-5.1 now → Qwen2.5-7V via mlx-lm later) ──
      - VISION_MODEL=${VISION_MODEL:-}
      # Legacy Ollama router vars (kept for backward compat, superseded by ROUTER_* above)
      - LLM_ROUTER_URL=${LLM_ROUTER_URL:-}
      - LLM_ROUTER_MODEL=${LLM_ROUTER_MODEL:-qwen2.5:7b}
      # Morning briefing
      - BRIEFING_ENABLED=${BRIEFING_ENABLED:-true}
      - BRIEFING_TIME=${BRIEFING_TIME:-07:30}
      - BRIEFING_TIMEZONE=${BRIEFING_TIMEZONE:-Europe/Paris}
      - REFLECTION_INTERVAL_HOURS=${REFLECTION_INTERVAL_HOURS:-6}
      - TRADE_DATA_DIR=/app/trade_data
    depends_on:
      - qdrant
      - redis
      
volumes:
  qdrant_data:
  redis_data:
  openwebui_data:
