services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: jarvis-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - WEBUI_NAME=Jarvis
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1
      - WEBUI_SECRET_KEY=jarvisopenwebui
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - RAG_EMBEDDING_ENGINE=
      - RAG_EMBEDDING_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - DEFAULT_MODELS=${PRIMARY_MODEL:-mlx-community/Qwen3-30B-A3B-4bit}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-5242880}
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - AIOHTTP_CLIENT_TIMEOUT=300
    depends_on:
      - qdrant
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant_data:
  redis_data:
  openwebui_data:
